services:
  postgres:
    image: postgres:18
    container_name: studygacha-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - studygacha_postgres_data:/var/lib/postgresql

  adminer:
    image: adminer:latest
    container_name: studygacha-adminer
    ports:
      - "8081:8080"
    depends_on:
      - postgres

volumes:
  studygacha_postgres_data: